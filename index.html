<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale 衝刺 200 等紀錄器</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; --accent: #ffca28; --input-bg: #2d2d2d; --blue: #2196f3; --red: #cf6679; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-color); color: var(--text-color); padding: 10px; margin: 0; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 600px; margin: auto; padding-bottom: 80px; }
        h3 { color: var(--accent); font-size: 16px; margin: 15px 0 8px 5px; }
        .card { background: var(--card-bg); padding: 12px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
        .grid-att { display: grid; grid-template-columns: 0.8fr 0.8fr 1fr 1fr 1fr 1fr 1fr; gap: 4px; margin-bottom: 8px; align-items: center; }
        .field { display: flex; flex-direction: column; align-items: center; }
        label { font-size: 10px; color: #aaa; margin-bottom: 3px; font-weight: bold; white-space: nowrap; text-align: center; width: 100%; }
        input, select { background: var(--input-bg); border: 1px solid #333; color: #fff; padding: 8px 4px; border-radius: 6px; font-size: 13px; width: 100%; box-sizing: border-box; outline: none; text-align: center; text-align-last: center; }
        input:disabled { opacity: 0.3; background: #1a1a1a; }
        .chk-field { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--input-bg); border: 1px solid #333; border-radius: 6px; height: 35px; width: 100%; }
        .chk-field input { width: 18px; height: 18px; cursor: pointer; margin: 0; }
        .range-box { background: #000; border: 1px solid #333; padding: 12px; border-radius: 8px; text-align: center; margin: 8px 0; }
        .range-val { color: var(--accent); font-size: 24px; font-weight: bold; }
        .stat-result-box { background: #181818; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-top: 8px; }
        .stat-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; color: #bbb; }
        .stat-row .val { color: var(--accent); font-weight: bold; }
        .btn-main { width: 100%; padding: 14px; background: var(--blue); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin: 12px 0; }
        .history-item { background: #252525; border: 1px solid #444; border-radius: 10px; margin-bottom: 10px; padding: 12px; border-left: 4px solid var(--accent); }
        .hist-header { display: flex; justify-content: space-between; border-bottom: 1px solid #444; padding-bottom: 6px; margin-bottom: 8px; }
        .hist-title { color: var(--accent); font-weight: bold; font-size: 13px; }
        .hist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; color: #bbb; font-size: 11px; }
        .hist-full { grid-column: span 2; padding-top: 4px; border-top: 1px dashed #444; margin-top: 4px; color: #bbb; font-size: 11px; }
        .hist-controls { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
        .btn-ctrl { background: #333; color: #fff; border: 1px solid #444; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        #custom_modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; }
        .modal-card { background: #2d2d2d; padding: 20px; border-radius: 12px; text-align: center; width: 80%; max-width: 280px; border: 1px solid #444; }
    </style>
</head>
<body>

<div id="custom_modal">
    <div class="modal-card">
        <div style="font-weight: bold; margin-bottom: 12px;">確定刪除紀錄？</div>
        <button class="btn-ctrl" style="background:var(--red); width:100%; height:36px; margin-bottom:8px;" id="modal_confirm_btn">確定刪除</button>
        <button class="btn-ctrl" style="background:#555; width:100%; height:36px;" onclick="closeModal()">取消</button>
    </div>
</div>

<div class="container">
    <h3>⚔️ Artale 數值與屬性設定</h3>
    <div class="card">
        <!-- Row 1 -->
        <div class="grid-3">
            <div class="field"><label>LEVEL</label><input type="number" id="lv" value="187" oninput="updateAll()"></div>
            <div class="field"><label>DEX(配點)</label><input type="number" id="dex_base" value="900" oninput="handleStatInput('dex')"></div>
            <div class="field"><label>DEX(裝備)</label><input type="number" id="dex_equip" value="149" oninput="handleStatInput('dex')"></div>
        </div>
        <!-- Row 2 -->
        <div class="grid-3">
            <div class="field">
                <label>楓葉祝福</label>
                <select id="skill_mw" onchange="handleMWChange()">
                    <option value="0" selected>0</option>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                </select>
            </div>
            <div class="field"><label>STR(配點)</label><input type="number" id="str_base" value="47" oninput="handleStatInput('str')"></div>
            <div class="field"><label>STR(裝備)</label><input type="number" id="str_equip" value="78" oninput="handleStatInput('str')"></div>
        </div>
        <!-- Row 3: 攻擊與 Buff -->
        <div class="grid-att">
            <div class="field"><label>迴響</label><div class="chk-field"><input type="checkbox" id="chk_echo" onchange="updateAll()"></div></div>
            <div class="field"><label>念力</label><div class="chk-field"><input type="checkbox" id="chk_conc" onchange="updateAll()"></div></div>
            <div class="field"><label>武器</label><input type="number" id="att_weapon" value="125" oninput="updateAll()"></div>
            <div class="field"><label>手套</label><input type="number" id="att_glove" value="12" oninput="updateAll()"></div>
            <div class="field"><label>矢+精</label><input type="number" id="att_arrow" value="12" oninput="updateAll()"></div>
            <div class="field"><label>其它</label><input type="number" id="att_other" value="1" oninput="updateAll()"></div>
            <div class="field"><label>活動</label><input type="number" id="att_act" value="0" oninput="updateAll()"></div>
        </div>

        <div class="range-box">
            <div class="range-val" id="range_display">0 ~ 0</div>
        </div>
    </div>

    <h3>🚀 衝刺 200 等練功計算</h3>
    <div class="card">
        <div class="grid-3">
            <div class="field"><label>等級 %</label><input type="number" id="exp_pct" value="85.84" step="0.01" oninput="updateAll()"></div>
            <div class="field"><label>效率 (W/10min)</label><input type="number" id="exp_eff" value="580" oninput="updateAll()"></div>
            <div class="field"><label>地圖</label><input type="text" id="map_name" value="烏魯莊園2" placeholder="請填寫地圖" oninput="autoSave()"></div>
        </div>

        <div class="stat-result-box">
            <div class="stat-row"><span>升下一級時間：</span><span class="val" id="time_next_lv">0.00 小時</span></div>
            <div class="stat-row"><span>離 200 等剩餘經驗：</span><span class="val" id="exp_remain_total">0 億</span></div>
            <div class="stat-row"><span>需練功次數 (10min/次)：</span><span class="val" id="count_remain_total">0 次</span></div>
        </div>

        <div class="field" style="margin-top:8px; width:100%;"><label style="text-align:left;">Note (備註)</label><textarea id="note_area" style="height:50px; background:var(--input-bg); color:#fff; border:1px solid #333; border-radius:6px; padding:8px; width:100%; box-sizing:border-box;" oninput="autoSave()"></textarea></div>
    </div>

    <button class="btn-main" onclick="logSnapshot()">✅ 紀錄目前衝刺進度</button>

    <h3>📜 歷史進度紀錄庫</h3>
    <div id="history_list"></div>
</div>
